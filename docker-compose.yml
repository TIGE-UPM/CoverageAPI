services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - key-service
      - data-service
      - test-service
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: coverage_db
      POSTGRES_USER: coverage
      POSTGRES_PASSWORD: coverage
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverage -d coverage_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Key service - lightweight
  key-service:
    build:
      context: .
      dockerfile: ./key-service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Data service - medium resources
  data-service:
    build:
      context: .
      dockerfile: ./data-service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://coverage:coverage@postgres:5432/coverage_db
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      - GEOIP_DB_PATH=/geoip/GeoLite2-City.mmdb
    volumes:
      - geoip_data:/geoip:ro
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Test service - latency, download and upload speed tests
  test-service:
    build:
      context: .
      dockerfile: ./test-service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://coverage:coverage@postgres:5432/coverage_db
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - MAX_DOWNLOAD_BYTES=${MAX_DOWNLOAD_BYTES:-10000000}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # GeoLite2 database updater (optional): downloads and refreshes the MaxMind
  # City database used by data-service for IP geolocation. Needs a free
  # MaxMind account. Start it with: docker compose --profile geoip up -d
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7
    profiles:
      - geoip
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip_data:/usr/share/GeoIP
    restart: unless-stopped

volumes:
  postgres_data:
  geoip_data:
