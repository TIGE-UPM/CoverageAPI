services:
# Nginx reverse proxy
  nginx:
    image: nginx:alpine
    networks:
      - dokploy-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - key-service
      - data-service
      - test-service
    restart: unless-stopped

  # Key service - lightweight
  key-service:
    build:
      context: .
      dockerfile: ./key-service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

  # Data service - medium resources
  data-service:
    build:
      context: .
      dockerfile: ./data-service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      - GEOIP_DB_PATH=/geoip/GeoLite2-City.mmdb
    volumes:
      - geoip_data:/geoip:ro
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

  # Test service - latency, download and upload speed tests
  test-service:
    build:
      context: .
      dockerfile: ./test-service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - MAX_DOWNLOAD_BYTES=${MAX_DOWNLOAD_BYTES:-10000000}
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped

  # GeoLite2 database updater: downloads and refreshes the MaxMind City
  # database used by data-service for IP geolocation. Requires
  # GEOIPUPDATE_ACCOUNT_ID and GEOIPUPDATE_LICENSE_KEY (free MaxMind account);
  # without them this container exits and data-service stores measurements
  # without a location.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip_data:/usr/share/GeoIP
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  geoip_data:
