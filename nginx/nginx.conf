upstream key_service {
    server key-service:8000;
}

upstream data_service {
    server data-service:8000;
}

upstream test_service {
    server test-service:8000;
}

server {
    listen 80;
    server_name localhost;

    # Increase client max body size for file uploads
    client_max_body_size 100M;

    # Key service routing
    location /api/generate-key {
        proxy_pass http://key_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Data service routing
    location /api/send-data {
        proxy_pass http://data_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Test service routing: latency
    location /api/test-ping {
        proxy_pass http://test_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Test service routing: download speed
    location /api/test-data-download {
        proxy_pass http://test_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the payload as generated and never compress it: the client
        # times the bytes it receives, so buffering or gzip would distort it.
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300;
    }

    # Test service routing: upload speed
    location /api/test-data-upload {
        proxy_pass http://test_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for upload processing
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Health checks and service discovery
    location /health/key {
        proxy_pass http://key_service/health;
    }

    location /health/data {
        proxy_pass http://data_service/health;
    }

    location /health/test {
        proxy_pass http://test_service/health;
    }

    # Kept for monitors configured before upload-service became test-service
    location /health/upload {
        proxy_pass http://test_service/health;
    }

    # Root endpoint - return API information
    location / {
        return 200 '{"message":"GIGA Coverage API","version":"1.0.0","endpoints":["/api/generate-key","/api/send-data","/api/test-ping","/api/test-data-download","/api/test-data-upload"],"health":["/health/key","/health/data","/health/test"]}';
        add_header Content-Type application/json;
    }
}
