version: '3.8'

services:
  # Nginx reverse proxy with SSL support
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl  # Mount SSL certificates
    depends_on:
      - key-service
      - data-service
      - test-service
    restart: unless-stopped

  # PostgreSQL with persistent storage
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups  # Backup mount point
    restart: unless-stopped
    # Don't expose port in production for security

  # Key service - scaled for high availability
  key-service:
    build: ./key-service
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    depends_on:
      - postgres

  # Data service - scaled for high throughput
  data-service:
    build: ./data-service
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - ENV=production
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      - GEOIP_DB_PATH=/geoip/GeoLite2-City.mmdb
    volumes:
      - geoip_data:/geoip:ro
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    depends_on:
      - postgres

  # Test service - latency, download and upload speed tests
  test-service:
    build: ./test-service
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - ENV=production
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - MAX_DOWNLOAD_BYTES=${MAX_DOWNLOAD_BYTES:-10000000}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped
    depends_on:
      - postgres

  # GeoLite2 database updater for IP geolocation (free MaxMind account required)
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip_data:/usr/share/GeoIP
    restart: unless-stopped

volumes:
  postgres_data:
  geoip_data: